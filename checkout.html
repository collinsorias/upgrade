<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Secure checkout</title>
  <link rel="stylesheet" href="cardinputfield.css">
  <style>
    :root {
      color-scheme: light;
      --paper: #ffffff;
      --ink: #17231d;
      --muted: #647068;
      --line: #d9ddd4;
      --green: #245c43;
      --lime: #d9f36a;
      --white: #ffffff;
      --serif: Georgia, "Times New Roman", serif;
      --sans: "Aptos", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(217, 243, 106, .20), transparent 34rem), #f4f3ec;
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    main { width: min(940px, calc(100% - 40px)); margin: 0 auto; padding: 58px 0; }
    .back { color: var(--green); font-size: 13px; font-weight: 700; text-decoration: none; }
    .back:hover { text-decoration: underline; }
    .layout { display: grid; grid-template-columns: 1.15fr .85fr; gap: 64px; align-items: start; margin-top: 54px; }
    .eyebrow { margin: 0 0 15px; color: var(--green); font-size: 12px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-family: var(--serif); font-size: clamp(38px, 5vw, 56px); font-weight: 400; line-height: 1.05; }
    .intro { max-width: 450px; margin: 17px 0 0; color: var(--muted); font-size: 15px; line-height: 1.65; }
    .secure-note { margin-top: 30px; padding: 24px 26px; border: 1px solid var(--line); border-radius: 8px; background: #ffffff; }
    .secure-note strong { display: block; margin-bottom: 6px; font-size: 13px; }
    .secure-note p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .summary { padding: 24px; border: 1px solid var(--line); border-radius: 5px; background: var(--white); }
    .summary h2 { margin: 0 0 22px; font-size: 12px; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; }
    .summary-row { display: flex; justify-content: space-between; gap: 18px; padding: 15px 0; border-top: 1px solid var(--line); font-size: 14px; }
    .summary-row span:last-child { font-weight: 700; text-align: right; }
    .summary-total { margin-top: 4px; padding-top: 18px; font-size: 16px; }
    .summary-total span:last-child { font-size: 20px; }
    .back-button { display: flex; width: 100%; min-height: 46px; align-items: center; justify-content: center; margin-top: 18px; border: 1px solid var(--ink); border-radius: 3px; background: transparent; color: var(--ink); cursor: pointer; font-family: var(--sans); font-size: 13px; font-weight: 700; transition: background 160ms ease, color 160ms ease; }
    .back-button:hover, .back-button:focus-visible { background: var(--green); color: white; }
    .back-button:focus-visible { outline: 3px solid #8aab61; outline-offset: 3px; }
    .payment-dialog { width: min(440px, calc(100% - 32px)); padding: 28px; border: 1px solid var(--line); border-radius: 5px; background: var(--white); color: var(--ink); box-shadow: 0 18px 60px rgba(23, 35, 29, .22); }
    .payment-dialog::backdrop { background: rgba(23, 35, 29, .48); }
    .payment-dialog h2 { margin: 0; font-family: var(--serif); font-size: 28px; font-weight: 400; }
    .payment-dialog p { margin: 14px 0 24px; color: var(--muted); font-size: 15px; line-height: 1.6; }
    .dialog-close { display: flex; width: 100%; min-height: 44px; align-items: center; justify-content: center; border: 0; border-radius: 3px; background: var(--green); color: white; cursor: pointer; font: inherit; font-size: 13px; font-weight: 700; }
    .dialog-close:hover, .dialog-close:focus-visible { background: #194832; }
    .dialog-close:focus-visible { outline: 3px solid #8aab61; outline-offset: 3px; }

    @media (max-width: 700px) {
      main { width: min(520px, calc(100% - 36px)); padding-top: 36px; }
      .layout { grid-template-columns: 1fr; gap: 28px; margin-top: 38px; }
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="index.html">&larr; Back to plans</a>
    <div class="layout">
      <section aria-labelledby="page-title">
        <p class="eyebrow">Account upgrade</p>
        <h1 id="page-title">Secure checkout</h1>
        <p class="intro">Review your plan before continuing to payment.</p>
        <div class="secure-note" role="status">
          <p class="intro">Enter your card details.</p>
          
    <form id="card-form">
      <div class="field">
        <label for="cardholder">Full Name</label>
        <input id="cardholder" name="cardholder" type="text" autocomplete="cc-name" placeholder="Alex Morgan" required>
      </div>

      <div class="field">
        <label for="card-number">Card number</label>
        <input id="card-number" name="card-number" type="text" inputmode="numeric" autocomplete="cc-number" placeholder="1234 5678 9012 3456" aria-describedby="card-number-hint" pattern="[0-9 ]{12,23}" maxlength="23" required>
        <p class="hint" id="card-number-hint"></p>
      </div>

      <div class="split-fields">
        <div class="field">
          <label for="expiry">Expiry date</label>
          <input id="expiry" name="expiry" type="text" inputmode="numeric" autocomplete="cc-exp" placeholder="MM/YY" aria-describedby="expiry-hint" pattern="(0[1-9]|1[0-2])/[0-9]{2}" maxlength="5" required>
          <p class="hint" id="expiry-hint"></p>
        </div>
        <div class="field">
          <label for="security-code">Security code</label>
          <input id="security-code" name="security-code" type="password" inputmode="numeric" autocomplete="cc-csc" placeholder="CVC" pattern="[0-9]{3,4}" maxlength="4" aria-label="Security code, 3 or 4 digits" required>
        </div>
      </div>

      
      <p class="status" id="form-status" role="status" aria-live="polite"></p>
    </form>
        </div>
      </section>

      <aside class="summary" aria-labelledby="summary-title">
        <h2 id="summary-title">Order summary</h2>
        <div class="summary-row"><span>Plan</span><span id="plan-name">Pro</span></div>
        <div class="summary-row"><span>Due today</span><span id="plan-price">$199</span></div>
        <div class="summary-row summary-total"><span>Total</span><span id="total-price">$199</span></div>
        <button class="back-button" id="continue-button" type="button">Continue</button>
      </aside>
    </div>
  </main>

  <dialog class="payment-dialog" id="payment-dialog" aria-labelledby="dialog-title">
    <h2 id="dialog-title">Payment option unavailable</h2>
    <p>invalid payment option, contact us on Telegram for alternate payment option</p>
    <a class="dialog-close" href="https://t.me/stock_js/">chat with us</a>
  </dialog>

  <script>
    const planOptions = {
      essential: { name: 'Essential', price: 50 },
      pro: { name: 'Pro', price: 199 },
      'pro-plus': { name: 'Pro Plus', price: 400 }
    };
    const requestedPlan = new URLSearchParams(window.location.search).get('plan');
    const selectedPlan = planOptions[requestedPlan] || planOptions.pro;
    const formattedPrice = `$${selectedPlan.price}`;

    document.querySelector('#plan-name').textContent = selectedPlan.name;
    document.querySelector('#plan-price').textContent = formattedPrice;
    document.querySelector('#total-price').textContent = formattedPrice;
    document.querySelector('#continue-button').addEventListener('click', () => {
      document.querySelector('#payment-dialog').showModal();
    });
  </script>
  <script src="cardinputfield.js"></script>
</body>
</html>
